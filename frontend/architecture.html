<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Architecture — Cognify</title>
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/site.css">
<style>
html,body{height:100%;overflow:hidden}
#app{height:100vh;display:flex;flex-direction:column;position:relative;z-index:1}
.stage{flex:1;min-height:0;position:relative;margin:14px 22px 0}
.cv{position:absolute;inset:0;border:1px solid var(--line);border-radius:22px;background:radial-gradient(ellipse at 50% 40%,rgba(139,92,246,.12),transparent 65%),#080d20;overflow:hidden}
.cv:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(143,153,194,.16) 1px,transparent 1px);background-size:24px 24px}
.lane{position:absolute;left:1.2%;right:1.2%;border-radius:16px;border:1px dashed rgba(143,153,194,.14)}
.lane b{position:absolute;left:16px;top:-9px;background:#080d20;padding:0 8px;font:600 10.5px "Inter";letter-spacing:.16em;text-transform:uppercase;color:#6f7bb0}
.lane.a{top:3%;height:27%;background:linear-gradient(90deg,rgba(139,92,246,.07),transparent)}.lane.b{top:36%;height:28%;background:linear-gradient(90deg,rgba(34,211,238,.06),transparent)}.lane.c{top:70%;height:27%;background:linear-gradient(90deg,rgba(52,211,153,.06),transparent)}
svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
svg path.e{fill:none;stroke:#2c3870;stroke-width:2.4}
svg path.e.lit{stroke:var(--cy);filter:drop-shadow(0 0 6px var(--cy));stroke-width:3}
svg circle.pk{fill:var(--pu2);opacity:.9;filter:drop-shadow(0 0 4px var(--pu2))}
.cn{position:absolute;transform:translate(-50%,-50%);width:158px;background:linear-gradient(180deg,#151e44,#0f1731);border:1px solid #28336a;border-radius:16px;padding:12px 14px;cursor:pointer;color:var(--tx);font:inherit;text-align:left;transition:.3s var(--ease);z-index:2}
.cn b{display:flex;align-items:center;gap:9px;font:600 14px/1.25 "Inter"}.cn b i{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor}
.cn i.ok{background:var(--ok);color:var(--ok)}.cn i.part{background:var(--wa);color:var(--wa)}.cn i.plan{background:#778;color:#778}
.cn.mem{border-color:rgba(139,92,246,.7);background:linear-gradient(180deg,#221a55,#140f36)}
.cn:hover,.cn.on{border-color:var(--pu2);transform:translate(-50%,-50%) scale(1.07);box-shadow:0 16px 40px -10px rgba(139,92,246,.85);z-index:4}
.cn.lit{border-color:var(--cy);box-shadow:0 0 0 4px rgba(34,211,238,.16),0 0 34px rgba(34,211,238,.5)}
.tools{position:absolute;right:16px;top:14px;z-index:5;display:flex;gap:10px;align-items:center}
.key{position:absolute;left:18px;bottom:12px;z-index:5;display:flex;gap:16px;font:500 12px "Inter";color:var(--mu)}.key span{display:flex;align-items:center;gap:7px}.key i{width:9px;height:9px;border-radius:50%}
.bar{height:206px;margin:14px 22px 18px;display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:14px}
.bar>div{border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,var(--card2),var(--card));padding:18px 20px;overflow:auto;animation:pin .4s var(--ease)}
@keyframes pin{from{opacity:.4;transform:translateY(6px)}}
.bar h2{font-size:24px;margin:10px 0 6px;letter-spacing:-.02em}.bar p{color:#c4ccec;font-size:14px;line-height:1.5}
.bar .lab{font:600 10.5px "Inter";letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px;display:block}
.bar .lim .lab{color:var(--wa)}.bar .loc .lab{color:var(--pu2)}
.mods{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.mods span{font:500 11.5px "JetBrains Mono";color:var(--cy);background:rgba(34,211,238,.06);border:1px solid rgba(34,211,238,.25);padding:3px 8px;border-radius:8px}
.row{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:5px 0;border-top:1px solid var(--line)}.row span{color:var(--mu)}
@media(max-width:1000px){html,body{overflow:auto}#app{height:auto}.stage{height:620px;flex:none}.cv{overflow:auto}.bar{grid-template-columns:1fr;height:auto}}
</style></head><body>
<div id="spot"></div><div id="grid"></div>
<div id="app">
<div id="navmount"></div>
<div class="stage"><div class="cv" id="cv"><div class="lane a"><b>Store &amp; learn</b></div><div class="lane b"><b>Answer path</b></div><div class="lane c"><b>Agents &amp; checks</b></div><svg id="svg"></svg>
  <div class="tools"><button class="btn sm" id="run">▶ Trace a question</button></div>
  <div class="key"><span><i style="background:var(--ok)"></i>Working</span><span><i style="background:var(--wa)"></i>Partial</span><span><i style="background:#778"></i>Planned</span></div></div></div>
<div class="bar" id="bar"></div>
</div>
<script src="/static/site.js"></script>
<script>
$("#navmount").outerHTML=nav("a");
const N={
 ui:{p:[6,50],k:"Chat UI",st:"ok",what:"What people use: a ChatGPT-style chat with history, document and photo upload, thumbs for feedback, light and dark mode.",how:"Single-page front end served by FastAPI. Conversations are kept in the browser; every request carries the signed token.",lim:"Conversation history lives in the browser (localStorage), not on the server, so it does not follow a person to another device.",mods:["frontend/index.html"],facts:[["Pages","landing · chat · how · architecture"],["History","browser only"],["Voice","browser speech"]]},
 api:{p:[22,50],k:"FastAPI backend",st:"ok",what:"Receives and processes every request: chat, uploads, runs, feedback, evaluation.",how:"One FastAPI app. Heavy calls run in a threadpool; agent runs stream to the browser over server-sent events.",lim:"A single process. No queue or horizontal scaling yet.",mods:["backend/app.py"],facts:[["Style","REST + SSE"],["Validation","pydantic models"],["Tests","94 passing"]]},
 auth:{p:[22,16],k:"Auth & workspace",st:"part",what:"Identifies the user and company, and keeps every company's memory separate.",how:"Company code + work email (domain limit) issue an HMAC-signed token. The first person to create a company is its admin. Each company has its own Hindsight bank. A guest session opens the public demo company.",lim:"No real email verification, no roles beyond admin/member, no departments. Stated plainly in the sign-in screen.",mods:["workspaces.py","app.py current()"],facts:[["Token","HMAC-signed"],["Isolation","bank per company"],["Missing","email verify · RBAC"]]},
 qp:{p:[38,50],k:"Query processing",st:"ok",what:"Understands what the person is doing before any memory is touched.",how:"Routes a message as a question, something to remember, or small talk. Pulls out machine ids, joins a short follow-up to the previous question, and scopes recall by tag when a machine or site is known.",lim:"Rule-based routing plus a model for small talk; no learned intent classifier.",mods:["chatintent.py","app.py chat()"],facts:[["Intents","ask · remember · greeting"],["Context","previous question"],["Scope","machine · site tags"]]},
 ingest:{p:[38,16],k:"Document ingestion",st:"ok",what:"How uploaded documents enter memory.",how:"Text is extracted (txt, md, csv, json, log, text PDF), cut into paragraph-aware sections of about 1,200 characters with overlap, and each section keeps its document name and number. A photo is kept with the caption the person writes.",lim:"60 sections and 2 MB per file. Scanned PDFs are refused; a picture is not read without a vision model.",mods:["documents.py","records.py"],facts:[["Chunk","≈1,200 chars + overlap"],["Limit","60 sections · 2 MB"],["Photos","caption is what is learned"]]},
 retain:{p:[54,16],k:"Hindsight retain",st:"ok",what:"How new experiences are stored.",how:"Each visit, note, document section or correction is written with tags (machine, site, kind), a date, a document id and its author. Hindsight ingests in the background, so recall can lag moments after a save; a local copy covers that gap.",lim:"Needs Hindsight credit; without it the same call writes to the local keyword store.",mods:["memory.py","records.py"],facts:[["Writes","tags · date · doc id · author"],["Lag","background ingestion"],["Fallback","local, flagged in UI"]]},
 db:{p:[70,16],k:"Database & cloud storage",st:"part",what:"Where everything persists.",how:"Hindsight Cloud holds the memory bank per company. A local keyword store mirrors it. Company registry, library, templates and uploaded pictures are JSON files and a folder on the server.",lim:"There is no relational database yet: those JSON files are fine for a demo, not for many companies. Conversations are not stored server-side.",mods:["memory.py","workspaces.py","data/ws/"],facts:[["Memory","Hindsight Cloud + local"],["Metadata","JSON files"],["Planned","Postgres + object storage"]]},
 recall:{p:[54,50],k:"Hindsight recall",st:"ok",what:"Actual organizational memory retrieval.",how:"Searches the company's bank for the records that match the question, tag-scoped when known, and returns each with its reference, date and tags. If Hindsight answers with nothing right after a save, a real keyword match from the local copy fills the gap and says so.",lim:"We rely on Hindsight's own search; there is no vector database of our own.",mods:["memory.py recall()","FallbackMemory"],facts:[["Returns","ref · date · text · tags"],["Top","8 records"],["Fallback","BM25, score above 0"]]},
 reflect:{p:[70,33],k:"Hindsight reflect",st:"ok",what:"How accumulated experiences are analyzed.",how:"Asks Hindsight to reason over the stored records and write an answer that reflects patterns across visits. The Thinking option asks for a larger reflect budget.",lim:"While a new bank is still ingesting, reflect can say 'nothing found'. Then the answer is written from the recalled records instead.",mods:["memory.py reflect()"],facts:[["Budget","low · high (Thinking)"],["Used by","chat · diagnostician"],["If empty","grounded summary"]]},
 ctx:{p:[70,50],k:"Context builder",st:"part",what:"Combines retrieved knowledge before it goes to Groq.",how:"Numbers the top records, puts any colleague correction first, tells the model to answer only from them and cite [1], [2], and to say NO_MATCH if none relate.",lim:"Simple: top 6 records trimmed to about 420 characters each. No re-ranking and no token-budget packing yet.",mods:["app.py _ask()","provenance.py"],facts:[["Records","6 × 420 chars"],["Order","corrections first"],["Guard","NO_MATCH"]]},
 groq:{p:[88,50],k:"Groq inference",st:"ok",what:"The language model that writes the answer.",how:"gpt-oss-120b, then gpt-oss-20b, then qwen, with retry-after handling. With no model available, rule-based backups answer plainly and the UI says so.",lim:"The free tier has daily token limits; a paid key removes that.",mods:["llm.py"],facts:[["Primary","gpt-oss-120b"],["Failover","2 more models"],["Voice","Whisper large-v3"]]},
 agents:{p:[38,84],k:"Agent orchestration",st:"part",what:"Coordinates the seven specialized agents.",how:"Alarm feed → Dispatcher (rules) → Diagnostician (recall + reflect + model) → Parts → Verifier → Technician briefing → Feedback & learning. They coordinate through the shared bank, and every handoff is a streamed event. Chaos drills switch one dependency off.",lim:"The Band transport between agents is tested against a mock only; without Band keys the same agents run in-process. A live Band run has not happened.",mods:["mesh/runner.py","agents.py"],facts:[["Agents","7"],["Transport","in-process · Band ready"],["Drills","band · memory · llm"]]},
 verifier:{p:[54,84],k:"Verifier",st:"part",what:"Checks proposed solutions.",how:"Deterministic code that reads the raw job records, can veto or revise a diagnosis (up to three rounds), and records why. Chat answers get an evidence label from the same provenance rules.",lim:"Free-form chat answers are labelled and cited but not yet run through the Verifier agent.",mods:["agents.py","provenance.py"],facts:[["Agent runs","can veto"],["Chat","evidence label"],["Rounds","max 3"]]},
 final:{p:[88,84],k:"Final response",st:"ok",what:"What the person sees: the answer, its sources, how well supported it is, and corrections first.",how:"Records are listed with reference and date; a colleague's correction shows ahead of the answer. With nothing in memory the reply says so and gives general guidance, labelled.",lim:"A numeric confidence appears only where a real scoring mechanism exists, never invented for chat.",mods:["app.py","provenance.py"],facts:[["Shows","answer · sources · basis"],["Empty","labelled guidance"],["Next steps","from the briefing"]]},
 feedback:{p:[88,16],k:"Feedback & learning",st:"ok",what:"Captures outcomes for future memory.",how:"A thumbs-down with a correction is retained and shown first next time. Repair outcomes move an evidence ladder (suspected → fixed at visit → stable 30 → 90 days) and a belief-drift engine flags when old lessons stop holding.",lim:"Real evaluation numbers need Hindsight credit and a paid model tier to run in full; the harness is built and leak-proof.",mods:["evidence.py","beliefs.py","evaluation.py"],facts:[["Evidence","Wilson intervals"],["Weak signal","n < 5"],["Eval","held-out replay"]]}
};
const E=[["ui","api"],["api","auth"],["api","qp"],["qp","recall"],["ingest","retain"],["retain","db"],["db","recall"],["db","reflect"],["recall","ctx"],["reflect","ctx"],["ctx","groq"],["groq","verifier"],["verifier","final"],["final","feedback"],["feedback","db"],["api","agents"],["agents","verifier"]];

const cv=$("#cv");
for(const [k,n] of Object.entries(N)){const b=document.createElement("button");b.className="cn"+(["recall","reflect","retain","db"].includes(k)?" mem":"");b.dataset.k=k;b.style.left=n.p[0]+"%";b.style.top=n.p[1]+"%";b.innerHTML=`<b><i class="${n.st}"></i>${n.k}</b>`;b.onclick=()=>pick(k);cv.appendChild(b)}
function pos(k){const r=cv.getBoundingClientRect();return [N[k].p[0]/100*r.width,N[k].p[1]/100*r.height]}
function draw(){const r=cv.getBoundingClientRect();const svg=$("#svg");svg.setAttribute("viewBox",`0 0 ${r.width} ${r.height}`);let out="";
  E.forEach(([a,b],i)=>{let [x1,y1]=pos(a),[x2,y2]=pos(b);const dx=x2-x1,dy=y2-y1,h=Math.abs(dx)>=Math.abs(dy)*.6;
    if(h){x1+=dx>0?80:-80;x2-=dx>0?80:-80}else{y1+=dy>0?28:-28;y2-=dy>0?28:-28}
    let d;if(a==="final"&&b==="feedback"){const [fx,fy]=pos(a),[tx,ty]=pos(b);d=`M${fx+80},${fy} C${fx+170},${fy} ${tx+170},${ty} ${tx+80},${ty}`}
    else if(h){const m=(x1+x2)/2;d=`M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}`}else{const mm=(y1+y2)/2;d=`M${x1},${y1} C${x1},${mm} ${x2},${mm} ${x2},${y2}`}
    out+=`<path class="e" id="p${i}" data-e="${a}-${b}" d="${d}"/>`});
  E.forEach((e,i)=>{out+=`<circle class="pk" r="3.6"><animateMotion dur="${(3.2+(i%5)*.7).toFixed(1)}s" begin="${(i*.35).toFixed(2)}s" repeatCount="indefinite"><mpath href="#p${i}"/></animateMotion></circle>`});
  svg.innerHTML=out}
draw();addEventListener("resize",draw);
const SL={ok:["Working","ok"],part:["Partially implemented","part"],plan:["Planned","plan"]};
function pick(k){const n=N[k];$$(".cn").forEach(b=>b.classList.toggle("on",b.dataset.k===k));const [lab,cls]=SL[n.st];
  $("#bar").innerHTML=`<div><span class="tag ${cls}">${lab}</span><h2>${esc(n.k)}</h2><p>${esc(n.what)}</p></div>
  <div class="lim"><span class="lab">Honest limit</span><p>${esc(n.lim)}</p></div>
  <div class="loc"><span class="lab">Where it lives</span><div class="mods">${n.mods.map(m=>`<span>${esc(m)}</span>`).join("")}</div>${n.facts.map(f=>`<div class="row"><span>${esc(f[0])}</span><b>${esc(f[1])}</b></div>`).join("")}</div>`}
const TRACE=["ui","api","auth","qp","recall","ctx","groq","verifier","final","feedback"];
let tracing=false;const sleep=ms=>new Promise(r=>setTimeout(r,ms));
$("#run").onclick=async()=>{if(tracing)return;tracing=true;$("#run").textContent="Tracing…";
  for(let i=0;i<TRACE.length;i++){const k=TRACE[i];pick(k);$(`.cn[data-k="${k}"]`).classList.add("lit");
    E.filter(([a,b])=>b===k&&(TRACE.slice(0,i).includes(a)||(k==="recall"&&a==="db"))).forEach(([a,b])=>{const e=$(`#svg path[data-e="${a}-${b}"]`);e&&e.classList.add("lit")});await sleep(1000)}
  $("#run").textContent="▶ Trace again";tracing=false;setTimeout(()=>{$$(".cn.lit").forEach(b=>b.classList.remove("lit"));$$("#svg path.lit").forEach(b=>b.classList.remove("lit"))},1500)};
pick("recall");
</script></body></html>
