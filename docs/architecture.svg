<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="SiteMemory architecture: four agents coordinating in a Band room on one shared Hindsight memory bank, checked by a Verifier that reads only raw records">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b8f97"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d6ff3d"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5b35"/></marker>
  </defs>
  <style>
    text{font-family:"Segoe UI",system-ui,sans-serif;fill:#ecebe5}
    .m{font-family:Consolas,"JetBrains Mono",monospace;fill:#8b8f97;font-size:11px}
    .t{font-size:14px;font-weight:700}.s{font-size:11.5px;fill:#8b8f97}
    .box{fill:#121417;stroke:#363b43;stroke-width:1.2}
    .ag{fill:#181b1f;stroke:#d6ff3d;stroke-width:1.4}
    .vf{fill:#181b1f;stroke:#7ea2ff;stroke-width:1.6}
    .room{fill:none;stroke:#8b8f97;stroke-width:1.2;stroke-dasharray:3 6}
    .ln{stroke:#8b8f97;stroke-width:1.4;fill:none}.gl{stroke:#d6ff3d;stroke-width:1.6;fill:none}.rl{stroke:#ff5b35;stroke-width:1.6;fill:none;stroke-dasharray:5 4}
  </style>
  <rect width="1000" height="640" fill="#0b0c0e"/>
  <text x="30" y="38" class="t" style="font-size:18px">SiteMemory: four agents in a Band room, one shared Hindsight bank, one Verifier that can veto</text>

  <!-- inputs -->
  <rect class="box" x="30" y="84" width="170" height="70" rx="12"/><text x="46" y="110" class="t">Alarm</text><text x="46" y="130" class="s">machine error code</text><text x="46" y="146" class="s">starts both paths</text>
  <rect class="box" x="30" y="190" width="170" height="92" rx="12"/><text x="46" y="216" class="t">Technician phone</text><text x="46" y="236" class="s">briefing, voice log</text><text x="46" y="252" class="s">Whisper, then confirm,</text><text x="46" y="268" class="s">then retain</text>
  <rect class="box" x="30" y="318" width="170" height="96" rx="12"/><text x="46" y="344" class="t">Control room + dashboard</text><text x="46" y="364" class="s">with vs without memory</text><text x="46" y="380" class="s">replay score, watchlist,</text><text x="46" y="396" class="s">ROI calculator</text>

  <!-- Band room -->
  <rect class="room" x="236" y="64" width="560" height="200" rx="18"/>
  <text x="256" y="90" class="t">Band room</text><text x="336" y="90" class="s">handoffs are real Band messages; in-process fallback if Band is down</text>
  <rect class="ag" x="256" y="112" width="118" height="116" rx="12"/><text x="271" y="138" class="t">Dispatcher</text><text x="271" y="158" class="s">remote fix or visit</text><text x="271" y="174" class="s">reset / setpoint /</text><text x="271" y="190" class="s">read log only</text><text x="271" y="216" class="m">never repeats a fail</text>
  <rect class="ag" x="392" y="112" width="118" height="116" rx="12"/><text x="405" y="138" class="t">Diagnostician</text><text x="407" y="158" class="s">recall + reflect</text><text x="407" y="174" class="s">n, verified rate,</text><text x="407" y="190" class="s">interval; n&lt;5 weak</text><text x="407" y="216" class="m">cites job ids</text>
  <rect class="ag" x="528" y="112" width="118" height="116" rx="12"/><text x="543" y="138" class="t">Parts agent</text><text x="543" y="158" class="s">what to carry</text><text x="543" y="174" class="s">van / warehouse</text><text x="543" y="190" class="s">stock flags</text><text x="543" y="216" class="m">proposes, never judges</text>
  <rect class="vf" x="664" y="112" width="118" height="116" rx="12"/><text x="679" y="138" class="t" style="fill:#7ea2ff">Verifier</text><text x="679" y="158" class="s">raw records only</text><text x="679" y="174" class="s">deterministic checks</text><text x="679" y="190" class="s">can veto, no LLM</text><text x="679" y="216" class="m">comparable units only</text>
  <path class="gl" d="M374 170H390" marker-end="url(#g)"/><path class="gl" d="M510 170H526" marker-end="url(#g)"/><path class="gl" d="M646 170H662" marker-end="url(#g)"/>
  <path class="rl" d="M723 112V100H451V110" marker-end="url(#r)"/><text x="560" y="105" class="m" style="fill:#ff5b35">veto, then revise</text>

  <!-- shared bank -->
  <rect class="room" x="236" y="300" width="560" height="172" rx="18" style="stroke:#d6ff3d"/>
  <text x="256" y="326" class="t" style="fill:#d6ff3d">One shared Hindsight bank</text><text x="440" y="326" class="s">retain, recall, reflect. Machine ids are validated</text>
  <rect x="256" y="344" width="126" height="108" rx="10" fill="#0b0c0e" stroke="#d6ff3d" stroke-dasharray="5 4"/><text x="268" y="368" class="m" style="fill:#ecebe5">kind:visit</text><text x="268" y="388" class="s">suspected cause,</text><text x="268" y="404" class="s">action taken,</text><text x="268" y="420" class="s">verified outcome</text><text x="268" y="438" class="m">+ evidence level</text>
  <rect x="394" y="344" width="126" height="108" rx="10" fill="#0b0c0e" stroke="#d6ff3d" stroke-dasharray="5 4"/><text x="406" y="368" class="m" style="fill:#ecebe5">kind:followup</text><text x="406" y="388" class="s">stable 30 days,</text><text x="406" y="404" class="s">stable 90 days, or</text><text x="406" y="420" class="s">it came back</text>
  <rect x="532" y="344" width="126" height="108" rx="10" fill="#0b0c0e" stroke="#d6ff3d" stroke-dasharray="5 4"/><text x="544" y="368" class="m" style="fill:#ecebe5">kind:alarm</text><text x="544" y="388" class="s">remote action tried,</text><text x="544" y="404" class="s">did it clear?</text><text x="544" y="438" class="m">kind:site, kind:belief</text>
  <rect x="670" y="344" width="112" height="108" rx="10" fill="#0b0c0e" stroke="#7ea2ff" stroke-dasharray="5 4"/><text x="680" y="368" class="m" style="fill:#7ea2ff">raw records</text><text x="680" y="388" class="s">the visit log the</text><text x="680" y="404" class="s">Verifier reads</text><text x="680" y="420" class="s">(never the agents')</text>
  <path class="ln" d="M451 228V298" marker-start="url(#a)" marker-end="url(#a)"/><path class="ln" d="M587 228V298" marker-start="url(#a)" marker-end="url(#a)"/><path class="ln" d="M335 228V298" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="ln" d="M723 228V342" marker-end="url(#a)" style="stroke:#7ea2ff"/>

  <!-- right -->
  <rect class="box" x="830" y="112" width="140" height="74" rx="12"/><text x="846" y="138" class="t">Groq</text><text x="846" y="158" class="s">gpt-oss-120b, with</text><text x="846" y="174" class="s">model failover; Whisper</text>
  <rect class="box" x="830" y="226" width="140" height="106" rx="12"/><text x="846" y="252" class="t">Evidence + beliefs</text><text x="846" y="272" class="s">suspected, fixed at</text><text x="846" y="288" class="s">visit, stable 30d/90d.</text><text x="846" y="304" class="s">Flags a lesson that</text><text x="846" y="320" class="s">stopped working</text>
  <path class="ln" d="M782 150H828" marker-start="url(#a)" marker-end="url(#a)"/><path class="ln" d="M830 280H800Q790 280 790 270V232" marker-end="url(#a)"/>

  <!-- left links -->
  <path class="ln" d="M200 119H236" marker-end="url(#a)"/><path class="ln" d="M200 236H222Q230 236 230 228V170H236" marker-end="url(#a)"/><path class="ln" d="M200 366H222Q230 366 230 374V386H236" marker-end="url(#a)"/>

  <text x="30" y="512" class="m" style="fill:#ecebe5">alarm, dispatch, diagnosis, parts, verification (veto and revise), briefing, simulated consequence, visit retained</text>
  <text x="30" y="536" class="s">The same four agents also run with no memory and no records, side by side, so the difference is visible. Replay evaluation briefs every past incident</text>
  <text x="30" y="554" class="s">using only records dated before it, tunes on training machines, and reports the score on held-out machines. Remote fixes and outcomes shown as Simulated are assumptions, not measurements.</text>
  <text x="30" y="590" class="m">All data is synthetic (a fictional HVAC contractor in Bengaluru).</text>
</svg>
